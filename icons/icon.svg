<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base Rounded Rectangle for App Icon -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#emeraldGrad)" stroke-width="6" stroke-opacity="0.4" />

  <!-- Dominica Mountain Silhouette Backdrop -->
  <path d="M 64 340 L 160 210 L 240 280 L 330 170 L 448 340 Z" fill="#047857" opacity="0.25" />
  <path d="M 120 340 L 220 230 L 290 290 L 370 200 L 448 340 Z" fill="#10b981" opacity="0.18" />

  <!-- Outer Glow Ring -->
  <circle cx="256" cy="230" r="140" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.3" stroke-dasharray="12 8" />

  <!-- Stylized Luxury Vehicle Front / Nature Wings Icon -->
  <g transform="translate(256, 230) scale(1.15)" filter="url(#shadow)">
    <!-- Shield / Emblem Base -->
    <path d="M 0 -85 L 68 -42 L 56 46 L 0 88 L -56 46 L -68 -42 Z" fill="#022c22" stroke="url(#goldGrad)" stroke-width="5" />

    <!-- Sleek Modern Car Silhouette inside Shield -->
    <!-- Windshield -->
    <path d="M -30 -15 L -18 -48 L 18 -48 L 30 -15 Z" fill="url(#emeraldGrad)" opacity="0.9" />
    <!-- Hood & Grille -->
    <path d="M -38 -10 L 38 -10 L 34 22 L -34 22 Z" fill="#0f172a" stroke="url(#emeraldGrad)" stroke-width="2.5" />
    <!-- Headlights -->
    <ellipse cx="-24" cy="2" rx="8" ry="3.5" fill="#fef08a" />
    <ellipse cx="24" cy="2" rx="8" ry="3.5" fill="#fef08a" />
    <!-- Grille detail lines -->
    <line x1="-16" y1="12" x2="16" y2="12" stroke="url(#goldGrad)" stroke-width="2" />
    <line x1="-12" y1="17" x2="12" y2="17" stroke="url(#goldGrad)" stroke-width="2" />

    <!-- Crown / Mountain Top Accent on Shield -->
    <path d="M -22 -62 L 0 -76 L 22 -62" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Typography "ELITE RIDE" -->
  <text x="256" y="415" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="4">
    ELITE RIDE
  </text>
  <text x="256" y="455" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="20" fill="#34d399" text-anchor="middle" letter-spacing="6">
    DOMINICA
  </text>
</svg>
