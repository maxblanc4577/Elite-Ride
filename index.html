  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-emerald-500 selection:text-white overscroll-none select-none">

    <script>
      // Clear search records on app refresh/load
      try {
        const keysToRemove = [];
        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          if (key && (key.toLowerCase().includes('search') || key.toLowerCase().includes('history') || key.toLowerCase().includes('recent') || key.toLowerCase().includes('query'))) {
            keysToRemove.push(key);
          }
        }
        keysToRemove.forEach(k => localStorage.removeItem(k));
      } catch (e) {}

      document.addEventListener('click', function(e) {
        const target = e.target.closest('button, [role="option"], li, div');
        if (target) {
          const text = target.innerText || '';
          
          // Explicitly check if click is inside navigation, header, sidebar, profile, or account menu
          const isNavOrProfile = target.closest('nav, header, [class*="nav"], [class*="menu"], [class*="profile"], [class*="avatar"], [class*="account"], [class*="sidebar"], [class*="user"], [class*="settings"]');
          if (isNavOrProfile) return;

          const parent = target.closest('[class*="search"], [class*="suggestion"], [class*="dropdown"], [class*="results"], [class*="list"], [class*="location"], [class*="pickup"], [class*="dropoff"], [class*="destination"]');
          if (parent || (target.tagName === 'BUTTON' && (text.length > 2 || target.closest('[class*="location"], [class*="place"], [class*="address"]')))) {
            setTimeout(() => {
              // Clear search records / history from localStorage
              try {
                const keysToRemove = [];
                for (let i = 0; i < localStorage.length; i++) {
                  const key = localStorage.key(i);
                  if (key && (key.toLowerCase().includes('search') || key.toLowerCase().includes('history') || key.toLowerCase().includes('recent') || key.toLowerCase().includes('query'))) {
                    keysToRemove.push(key);
                  }
                }
                keysToRemove.forEach(k => localStorage.removeItem(k));
              } catch (e) {}

              const inputs = document.querySelectorAll('input[type="text"], input[type="search"]');
              inputs.forEach(input => {
                const placeholder = (input.placeholder || '').toLowerCase();
                if (
                  placeholder.includes('search') ||
                  placeholder.includes('where') ||
                  placeholder.includes('pickup') ||
                  placeholder.includes('drop') ||
                  placeholder.includes('destination') ||
                  placeholder.includes('location')
                ) {
                  input.value = '';
                  input.dispatchEvent(new Event('input', { bubbles: true }));
                  input.dispatchEvent(new Event('change', { bubbles: true }));
                  input.blur();
                }
              });
            }, 150);
          }
        }
      }, true);
    </script>

    <!-- Vehicle Category Selection & Stripe Confirmation Dialog Integration -->
    <script>
      window.eliteVehicleCategory = 'standard';
      window.eliteVehicleMultipliers = {
        standard: { name: 'Standard Sedan', multiplier: 1.0, desc: 'Everyday comfortable ride (1-4 pax)', icon: '🚗' },
        suv: { name: 'Rugged 4x4 SUV', multiplier: 1.35, desc: 'Ideal for mountain terrain & nature spots (1-6 pax)', icon: '🚙' },
        premium: { name: 'VIP Luxury Transit', multiplier: 1.8, desc: 'Premium executive comfort & airport transfer', icon: '✨' }
      };

      function injectVehicleSelectorUI() {
        if (document.getElementById('elite-vehicle-widget')) return;
        const widget = document.createElement('div');
        widget.id = 'elite-vehicle-widget';
        widget.className = 'fixed bottom-4 right-4 z-50 bg-slate-900/95 border border-emerald-500/40 rounded-2xl p-4 shadow-2xl backdrop-blur-md text-white max-w-sm w-full transition-all duration-300';
        widget.innerHTML = `
          <div class="flex items-center justify-between mb-3">
            <div class="flex items-center space-x-2">
              <span class="text-xl">🚕</span>
              <div>
                <h4 class="font-bold text-sm tracking-wide text-emerald-400">Select Vehicle Category</h4>
                <p class="text-xs text-slate-400">Unique pricing multipliers applied</p>
              </div>
            </div>
            <button id="toggle-veh-btn" class="text-slate-400 hover:text-white text-xs bg-slate-800 px-2 py-1 rounded-lg">Minimize</button>
          </div>
          <div id="veh-options-list" class="space-y-2">
            ${Object.entries(window.eliteVehicleMultipliers).map(([key, cat]) => `
              <div data-category="${key}" class="veh-cat-card cursor-pointer p-2.5 rounded-xl border ${key === window.eliteVehicleCategory ? 'border-emerald-500 bg-emerald-950/40 shadow-emerald-500/10 shadow-lg' : 'border-slate-800 bg-slate-800/50 hover:bg-slate-800'} transition-all flex items-center justify-between">
                <div class="flex items-center space-x-3">
                  <span class="text-2xl">${cat.icon}</span>
                  <div>
                    <div class="font-semibold text-sm">${cat.name}</div>
                    <div class="text-[11px] text-slate-400">${cat.desc}</div>
                  </div>
                </div>
                <div class="text-right">
                  <span class="inline-block px-2 py-0.5 rounded-full text-xs font-bold ${key === window.eliteVehicleCategory ? 'bg-emerald-500 text-slate-950' : 'bg-slate-700 text-slate-300'}">
                    ${cat.multiplier}x
                  </span>
                </div>
              </div>
            `).join('')}
          </div>
        `;
        document.body.appendChild(widget);

        widget.querySelectorAll('.veh-cat-card').forEach(card => {
          card.addEventListener('click', () => {
            const catKey = card.getAttribute('data-category');
            window.eliteVehicleCategory = catKey;
            
            widget.querySelectorAll('.veh-cat-card').forEach(c => {
              const isSel = c.getAttribute('data-category') === catKey;
              c.className = `veh-cat-card cursor-pointer p-2.5 rounded-xl border ${isSel ? 'border-emerald-500 bg-emerald-950/40 shadow-emerald-500/10 shadow-lg' : 'border-slate-800 bg-slate-800/50 hover:bg-slate-800'} transition-all flex items-center justify-between`;
              const badge = c.querySelector('span:last-child');
              badge.className = `inline-block px-2 py-0.5 rounded-full text-xs font-bold ${isSel ? 'bg-emerald-500 text-slate-950' : 'bg-slate-700 text-slate-300'}`;
            });

            window.dispatchEvent(new CustomEvent('elite-vehicle-changed', { detail: { category: catKey, multiplier: window.eliteVehicleMultipliers[catKey].multiplier } }));
          });
        });

        let minimized = false;
        const toggleBtn = widget.querySelector('#toggle-veh-btn');
        const listDiv = widget.querySelector('#veh-options-list');
        toggleBtn.addEventListener('click', () => {
          minimized = !minimized;
          listDiv.style.display = minimized ? 'none' : 'block';
          toggleBtn.innerText = minimized ? 'Expand' : 'Minimize';
        });
      }

      function showStripeConfirmationModal(details = {}) {
        let modal = document.getElementById('stripe-success-confirmation-dialog');
        if (!modal) {
          modal = document.createElement('div');
          modal.id = 'stripe-success-confirmation-dialog';
          modal.className = 'fixed inset-0 bg-slate-950/80 backdrop-blur-md z-[10000] flex items-center justify-center p-4 animate-fade-in';
          document.body.appendChild(modal);
        }

        const amount = details.amount || '48.50';
        const txId = details.transactionId || ('STRIPE-DOM-' + Math.floor(100000 + Math.random() * 900000));
        const timestamp = new Date().toLocaleString();

        modal.innerHTML = `
          <div class="bg-slate-900 border border-emerald-500/50 rounded-3xl p-6 max-w-md w-full shadow-2xl text-slate-100 relative overflow-hidden">
            <div class="absolute -right-12 -top-12 w-36 h-36 bg-emerald-500/10 rounded-full blur-2xl pointer-events-none"></div>
            
            <div class="text-center mb-6">
              <div class="w-16 h-16 bg-emerald-500/20 border border-emerald-500/50 text-emerald-400 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl shadow-lg shadow-emerald-500/20 animate-bounce">
                ✓
              </div>
              <h3 class="text-2xl font-bold tracking-tight text-white mb-1">Stripe Payment Successful!</h3>
              <p class="text-sm text-emerald-400 font-medium">Your ride and secure digital payment have been confirmed</p>
            </div>

            <div class="bg-slate-950/70 border border-slate-800 rounded-2xl p-4 space-y-3 mb-6 text-sm">
              <div class="flex justify-between items-center pb-2 border-b border-slate-800/80">
                <span class="text-slate-400">Transaction Ref</span>
                <span class="font-mono font-semibold text-emerald-400">${txId}</span>
              </div>
              <div class="flex justify-between items-center pb-2 border-b border-slate-800/80">
                <span class="text-slate-400">Amount Paid</span>
                <span class="font-bold text-white text-base">EC$ ${amount}</span>
              </div>
              <div class="flex justify-between items-center pb-2 border-b border-slate-800/80">
                <span class="text-slate-400">Gateway</span>
                <span class="text-slate-200 flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-emerald-400"></span> Stripe Secure Gateway</span>
              </div>
              <div class="flex justify-between items-center">
                <span class="text-slate-400">Timestamp</span>
                <span class="text-slate-300 text-xs">${timestamp}</span>
              </div>
            </div>

            <div class="space-y-3">
              <button id="stripe-modal-done-btn" class="w-full bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-slate-950 font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-emerald-500/20 transition-all text-center">
                View Live Driver Tracking
              </button>
              <button id="stripe-modal-close-btn" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium py-2.5 px-4 rounded-xl transition-all text-xs text-center">
                Close
              </button>
            </div>
          </div>
        `;
        modal.style.display = 'flex';

        document.getElementById('stripe-modal-done-btn').onclick = () => {
          modal.style.display = 'none';
          clearTotalAmountToZero();
        };
        document.getElementById('stripe-modal-close-btn').onclick = () => {
          modal.style.display = 'none';
          clearTotalAmountToZero();
        };
      }

      function clearTotalAmountToZero() {
        try {
          for (let i = localStorage.length - 1; i >= 0; i--) {
            const key = localStorage.key(i);
            if (key && (key.toLowerCase().includes('total') || key.toLowerCase().includes('amount') || key.toLowerCase().includes('fare') || key.toLowerCase().includes('price') || key.toLowerCase().includes('pay'))) {
              localStorage.setItem(key, '0.00');
            }
          }
          document.querySelectorAll('input, span, div, p').forEach(el => {
            const text = el.innerText || '';
            if ((text.includes('EC$') || text.includes('$')) && (text.includes('Total') || text.includes('Amount') || text.includes('Fare') || text.includes('Price'))) {
              if (el.children.length === 0) {
                el.innerText = el.innerText.replace(/[\d,.]+/g, '0.00');
              }
            }
          });
        } catch (e) {}
      }

      window.addEventListener('DOMContentLoaded', () => {
        setTimeout(injectVehicleSelectorUI, 500);

        const params = new URLSearchParams(window.location.search);
        if (params.get('stripe_success') === 'true' || params.get('success') === 'true' || params.get('session_id') || window.location.href.includes('checkout-chapter') || window.location.href.includes('success')) {
          setTimeout(() => {
            showStripeConfirmationModal({
              amount: params.get('amount') || '48.50',
              transactionId: params.get('session_id') ? 'STRIPE-' + params.get('session_id').slice(-8).toUpperCase() : undefined
            });
            clearTotalAmountToZero();
          }, 800);
        }
      });

      window.addEventListener('elite-payment-success', (e) => {
        showStripeConfirmationModal(e.detail || {});
        clearTotalAmountToZero();
      });

      // Intercept clicks for Login/Sign in, Final Payment, and Payment Confirmation
      document.addEventListener('click', (e) => {
        const btn = e.target.closest('button');
        if (btn) {
          const txt = (btn.innerText || '').toLowerCase();
          // After login / sign in
          if (txt.includes('login') || txt.includes('sign in') || txt.includes('log in') || txt.includes('authenticate')) {
            setTimeout(clearTotalAmountToZero, 300);
          }
          // After final payment / submit payment
          if (txt.includes('pay') || txt.includes('checkout') || txt.includes('confirm payment') || txt.includes('complete booking')) {
            setTimeout(clearTotalAmountToZero, 500);
          }
          // Stripe checkout simulation
          if (txt.includes('stripe') || txt.includes('card payment') || txt.includes('pay with')) {
            setTimeout(() => {
              showStripeConfirmationModal({ amount: '52.00' });
              clearTotalAmountToZero();
            }, 1200);
          }
        }
      }, true);

      // Reorganize footer columns to match requested categories
      function reorganizeFooter() {
        const footerCols = document.querySelectorAll('footer div > div:nth-of-type(2) > div');
        const titles = [
          "about & story", 
          "drivers", 
          "safety & code of conduct", 
          "mobanking & payment terms", 
          "mountain 4wd & luggage"
        ];
        
        footerCols.forEach((col, idx) => {
          if (titles[idx]) {
            const h = col.querySelector('h3, h4, h5, strong, span, div:first-child');
            if (h) {
              h.innerText = titles[idx];
              h.style.textTransform = 'lowercase';
            }
          }
        });
      }

      window.addEventListener('DOMContentLoaded', () => {
        setTimeout(reorganizeFooter, 600);
        setTimeout(reorganizeFooter, 1500); // secondary check after React hydrate
      });
    </script>
