    <script>
      // Clear search records on app refresh/load
      try {
        const keysToRemove = [];
        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          if (key && (key.toLowerCase().includes('search') || key.toLowerCase().includes('history') || key.toLowerCase().includes('recent') || key.toLowerCase().includes('query'))) {
            keysToRemove.push(key);
          }
        }
        keysToRemove.forEach(k => localStorage.removeItem(k));
      } catch (e) {}

      document.addEventListener('click', function(e) {
        const target = e.target.closest('button, [role="option"], li, div');
        if (target) {
          const text = target.innerText || '';
          
          // Explicitly check if click is inside navigation, header, sidebar, profile, or account menu
          const isNavOrProfile = target.closest('nav, header, [class*="nav"], [class*="menu"], [class*="profile"], [class*="avatar"], [class*="account"], [class*="sidebar"], [class*="user"], [class*="settings"]');
          if (isNavOrProfile) return;

          const parent = target.closest('[class*="search"], [class*="suggestion"], [class*="dropdown"], [class*="results"], [class*="list"], [class*="location"], [class*="pickup"], [class*="dropoff"], [class*="destination"]');
          if (parent || (target.tagName === 'BUTTON' && (text.length > 2 || target.closest('[class*="location"], [class*="place"], [class*="address"]')))) {
            setTimeout(() => {
              // Clear search records / history from localStorage
              try {
                const keysToRemove = [];
                for (let i = 0; i < localStorage.length; i++) {
                  const key = localStorage.key(i);
                  if (key && (key.toLowerCase().includes('search') || key.toLowerCase().includes('history') || key.toLowerCase().includes('recent') || key.toLowerCase().includes('query'))) {
                    keysToRemove.push(key);
                  }
                }
                keysToRemove.forEach(k => localStorage.removeItem(k));
              } catch (e) {}

              const inputs = document.querySelectorAll('input[type="text"], input[type="search"]');
              inputs.forEach(input => {
                const placeholder = (input.placeholder || '').toLowerCase();
                if (
                  placeholder.includes('search') ||
                  placeholder.includes('where') ||
                  placeholder.includes('pickup') ||
                  placeholder.includes('drop') ||
                  placeholder.includes('destination') ||
                  placeholder.includes('location')
                ) {
                  input.value = '';
                  input.dispatchEvent(new Event('input', { bubbles: true }));
                  input.dispatchEvent(new Event('change', { bubbles: true }));
                  input.blur();
                }
              });
            }, 150);
          }
        }
      }, true);
    </script>

    <!-- Vehicle Category Selection & Stripe Confirmation Dialog Integration -->

                <div>
                  <div class="text-xs font-bold text-sky-400">Group Ride Share</div>
                  <div class="text-[10px] text-slate-400">Save 20% & share with passengers</div>

              <label class="relative inline-flex items-center cursor-pointer">
                <input type="checkbox" id="group-ride-checkbox" class="sr-only peer">
                <div class="w-9 h-5 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-emerald-500"></div>

            <!-- Capacity Indicator Badge -->
            <div id="group-ride-capacity-badge" class="mb-3 text-[11px] bg-slate-950/60 border border-slate-800 rounded-lg p-2 flex items-center justify-between text-slate-300" style="display:none;">
              <span class="flex items-center gap-1">🚌 Shared Capacity:</span>
              <span class="font-bold text-emerald-400">2 / 4 Seats Available</span>
            </div>

            <div id="veh-options-list" class="space-y-2">
              ${Object.entries(window.eliteVehicleMultipliers).map(([key, cat]) => `
                <div data-category="${key}" class="veh-cat-card cursor-pointer p-2 rounded-xl border ${key === window.eliteVehicleCategory ? 'border-emerald-500 bg-emerald-950/40 shadow-emerald-500/10 shadow-lg' : 'border-slate-800 bg-slate-800/50 hover:bg-slate-800'} transition-all flex items-center justify-between">
                  <div class="flex items-center space-x-2.5">
                    <span class="text-xl">${cat.icon}</span>
                    <div>
                      <div class="font-semibold text-xs">${cat.name}</div>
                      <div class="text-[10px] text-slate-400">${cat.desc}</div>
                    </div>
                  </div>
                  <div class="text-right">
                    <span class="veh-mult-badge inline-block px-2 py-0.5 rounded-full text-xs font-bold ${key === window.eliteVehicleCategory ? 'bg-emerald-500 text-slate-950' : 'bg-slate-700 text-slate-300'}" data-base-mult="${cat.multiplier}">
                      ${cat.multiplier}x

              `).join('')}

          </div>
        `;
        document.body.appendChild(widget);

        const groupCheckbox = widget.querySelector('#group-ride-checkbox');
        const capacityBadge = widget.querySelector('#group-ride-capacity-badge');

        groupCheckbox.addEventListener('change', () => {
          window.eliteGroupRideActive = groupCheckbox.checked;
          capacityBadge.style.display = window.eliteGroupRideActive ? 'flex' : 'none';

          widget.querySelectorAll('.veh-cat-card').forEach(c => {
            const badge = c.querySelector('.veh-mult-badge');

            const adjustedMult = window.eliteGroupRideActive ? (baseMult * 0.8).toFixed(2) : baseMult;
            badge.innerText = `${adjustedMult}x`;

          window.dispatchEvent(new CustomEvent('elite-vehicle-changed', { 
            detail: { category: window.eliteVehicleCategory, multiplier: window.eliteVehicleMultipliers[window.eliteVehicleCategory].multiplier, groupRide: window.eliteGroupRideActive } 
          }));
        });

        widget.querySelectorAll('.veh-cat-card').forEach(card => {
          card.addEventListener('click', () => {
            const catKey = card.getAttribute('data-category');

          minimized = !minimized;

          toggleBtn.innerText = minimized ? 'Expand' : 'Minimize';
        });
      }

      function clearTotalAmountToZero() {
        try {
          for (let i = localStorage.length - 1; i >= 0; i--) {
            const key = localStorage.key(i);
            if (key && (key.toLowerCase().includes('total') || key.toLowerCase().includes('amount') || key.toLowerCase().includes('fare') || key.toLowerCase().includes('price') || key.toLowerCase().includes('pay') || key.toLowerCase().includes('balance') || key.toLowerCase().includes('wallet') || key.toLowerCase().includes('pickup') || key.toLowerCase().includes('drop') || key.toLowerCase().includes('destination') || key.toLowerCase().includes('location') || key.toLowerCase().includes('route'))) {
              if (key.toLowerCase().includes('total') || key.toLowerCase().includes('amount') || key.toLowerCase().includes('fare') || key.toLowerCase().includes('price') || key.toLowerCase().includes('pay') || key.toLowerCase().includes('balance') || key.toLowerCase().includes('wallet')) {
                localStorage.setItem(key, '0.00');
              } else {
                localStorage.removeItem(key);
              }
            }
          }

          // Clear pickup and drop-off input fields
          document.querySelectorAll('input').forEach(input => {
            const ph = (input.placeholder || '').toLowerCase();
            const id = (input.id || '').toLowerCase();
            const name = (input.name || '').toLowerCase();
            if (ph.includes('pickup') || ph.includes('drop') || ph.includes('destination') || ph.includes('location') || ph.includes('where') || ph.includes('search') ||
                id.includes('pickup') || id.includes('drop') || id.includes('destination') || id.includes('location') ||
                name.includes('pickup') || name.includes('drop') || name.includes('destination') || name.includes('location')) {
              input.value = '';
            }
          });

          // Aggressively zero out any element showing currency / fare / total / price / balance / payment
          const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null, false);
          let node;
          while (node = walker.nextNode()) {
            if (node.nodeValue) {
              let val = node.nodeValue;
              if ((val.includes('EC$') || val.includes('$') || val.toLowerCase().includes('fare') || val.toLowerCase().includes('total') || val.toLowerCase().includes('amount') || val.toLowerCase().includes('price'))) {
                // Replace any numbers following EC$ or $ or inside fare/total labels with 0.00
                node.nodeValue = val.replace(/(EC\$|\$)\s*[\d,.]+/g, '$1 0.00').replace(/([\d,.]+\s*(EC\$|\$))/g, '0.00 $2');
              }
            }
          }
          document.querySelectorAll('input, span, div, p, td, th').forEach(el => {
            if (el.children.length === 0) {
              const text = el.innerText || '';
              if ((text.includes('EC$') || text.includes('$')) && /\d+/.test(text)) {
                el.innerText = text.replace(/(EC\$|\$)\s*[\d,.]+/g, '$1 0.00');
              }
            }
          });
        } catch (e) {}
      }

      function playNotificationChime() {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(587.33, ctx.currentTime); // D5
          osc.frequency.setValueAtTime(880, ctx.currentTime + 0.1); // A5
          gain.gain.setValueAtTime(0.1, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.4);
        } catch (e) {}
      }

          const fill = document.getElementById('trip-progress-bar-fill');
          const distLabel = document.getElementById('trip-prog-distance');
          const percentLabel = document.getElementById('trip-prog-percent');
          if (!fill) return;

          tripProgressPercent = (tripProgressPercent + 2) % 96;
          let remainingMiles = Math.max(0.2, (4.2 * (1 - tripProgressPercent / 100))).toFixed(1);

          fill.style.width = tripProgressPercent + '%';
          if (distLabel) distLabel.innerText = `${remainingMiles} mi remaining`;
          if (percentLabel) percentLabel.innerText = `${tripProgressPercent}% Completed`;

          const marker = document.getElementById('svg-driver-marker');

          const etaBadge = document.getElementById('map-eta-badge');

          const coordsText = document.getElementById('map-coords-text');

          if (!marker) return;

          mapProgress = (mapProgress + 3) % 92;
          if (progressBar) progressBar.style.width = mapProgress + '%';

          let t = mapProgress / 100;
          let x = Math.round((1 - t) * (1 - t) * 120 + 2 * (1 - t) * t * 140 + t * t * 180);
          let y = Math.round((1 - t) * (1 - t) * 150 + 2 * (1 - t) * t * 85 + t * t * 35);
          marker.setAttribute('transform', `translate(${x}, ${y})`);

          let remainingDist = Math.max(0.1, (1 - t) * 1.2).toFixed(1);
          let etaMin = Math.max(1, Math.ceil(remainingDist * 2));
          if (distText) distText.innerText = `Distance to Pickup: ${remainingDist} mi`;
          if (etaBadge) etaBadge.innerText = `ETA: ${etaMin} min`;
          if (speedText) speedText.innerText = `${Math.floor(22 + Math.random() * 8)} mph`;
          
          let lat = (15.3015 + (t * 0.012)).toFixed(4);
          let lng = (-61.3885 - (t * 0.008)).toFixed(4);
          if (coordsText) coordsText.innerText = `Lat: ${lat}° N, Lng: ${lng}° W`;

             listenBtn.innerText = '🎙️ Start Voice Command Listener';
             listenBtn.style.background = '#0284c7';
           }
           return;
         }

         recognition = new SpeechRecognition();
         recognition.continuous = true;
         recognition.interimResults = true;
         recognition.lang = 'en-US';

         recognition.onstart = () => {
           isListeningVoice = true;
           if (statusBadge) statusBadge.innerText = 'Status: Listening... Say "Elite Emergency"';
           if (listenBtn) {
             listenBtn.innerText = '🛑 Stop Voice Listener';
             listenBtn.style.background = '#dc2626';
           }
         };

         recognition.onresult = (event) => {
           for (let i = event.resultIndex; i < event.results.length; ++i) {
             const transcript = event.results[i][0].transcript.toLowerCase();
             console.log("Heard speech:", transcript);
             if (transcript.includes('elite emergency') || transcript.includes('emergency')) {
               console.log("Trigger phrase detected!");
               window.playSOSSiren();
               if (statusBadge) statusBadge.innerText = '🚨 PHRASE DETECTED! SOS SIREN TRIGGERED!';
               if (recognition) {
                 try { recognition.stop(); } catch (e) {}
               }
               isListeningVoice = false;
               if (listenBtn) {
                 listenBtn.innerText = '🎙️ Start Voice Command Listener';
                 listenBtn.style.background = '#0284c7';
               }
               break;
             }
           }
         };

         recognition.onerror = (event) => {
           console.error("Speech recognition error", event.error);
           if (statusBadge) statusBadge.innerText = 'Status: Error (' + event.error + ') - Click to retry';
           isListeningVoice = false;
           if (listenBtn) {
             listenBtn.innerText = '🎙️ Start Voice Command Listener';
             listenBtn.style.background = '#0284c7';
           }
         };

         recognition.onend = () => {
           if (isListeningVoice) {
             try { recognition.start(); } catch (e) {}
           }
         };

         try {
           recognition.start();
         } catch (e) {
           console.error(e);
           alert("Could not start voice recognition. Microphone permission may be required.");
         }
       };

      let sosAudioCtx = null;
      let sosOscillator = null;
      let sosGainNode = null;
      let sosIntervalTimer = null;

      window.playSOSSiren = function() {
        try {
          if (sosAudioCtx) {
            window.stopSOSSiren();
          }
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          sosAudioCtx = new AudioContext();

          sosOscillator = sosAudioCtx.createOscillator();
          sosGainNode = sosAudioCtx.createGain();

          sosOscillator.type = 'sawtooth';
          sosOscillator.frequency.setValueAtTime(600, sosAudioCtx.currentTime);

          sosGainNode.gain.setValueAtTime(0.3, sosAudioCtx.currentTime);

          sosOscillator.connect(sosGainNode);
          sosGainNode.connect(sosAudioCtx.destination);
          sosOscillator.start();

          // Modulate frequency for wailing siren effect (600Hz <-> 1200Hz)
          let high = true;
          sosIntervalTimer = setInterval(() => {
            if (!sosAudioCtx) return;
            high = !high;
            sosOscillator.frequency.setTargetAtTime(high ? 1200 : 600, sosAudioCtx.currentTime, 0.1);
          }, 400);

          const badge = document.getElementById('siren-status-badge');
          if (badge) badge.innerText = '🚨 SOS Siren Active & Pulsating! (Drawing Public Attention)';
          dispatchSosToTrustedContacts();
        } catch (e) {
          console.error(e);
          alert("Audio Context error or autoplay blocked. Please interact and try again.");
        }
      };

      window.stopSOSSiren = function() {
        if (sosIntervalTimer) clearInterval(sosIntervalTimer);
        sosIntervalTimer = null;
        if (sosOscillator) {
          try { sosOscillator.stop(); } catch (e) {}
          sosOscillator.disconnect();
          sosOscillator = null;
        }
        if (sosAudioCtx) {
          try { sosAudioCtx.close(); } catch (e) {}
          sosAudioCtx = null;
        }
        const badge = document.getElementById('siren-status-badge');
        if (badge) badge.innerText = '⏹️ Siren stopped.';
      };

      window.cancelScheduledRide = function(index) {
        const rides = JSON.parse(localStorage.getItem('elite_scheduled_rides') || '[]');
        const ride = rides[index];
        if (!ride) return;

        const rideDateTime = new Date(`${ride.date}T${ride.time}`).getTime();
        const now = Date.now();
        const diffMinutes = (rideDateTime - now) / (1000 * 60);

        if (diffMinutes <= 60 && diffMinutes >= 0) {
          const penaltyAmount = (45.00 * 0.15).toFixed(2);
          alert(`⚠️ Late Cancellation Fee Applied!\n\nYou cancelled within 60 minutes of your scheduled pickup time (${Math.round(diffMinutes)} mins remaining).\nA 15% service penalty of EC$ ${penaltyAmount} has been automatically charged to your saved payment method (Stripe Card •••• 4242).\n\nConfirmation sent to info@elite-ride.org.`);
        } else if (diffMinutes < 0) {
          alert(`Notice: This scheduled ride time has already passed. Ride removed from history.`);
        } else {
          alert(`✓ Scheduled ride successfully cancelled free of charge (>60 mins prior).`);
        }

        rides.splice(index, 1);
        localStorage.setItem('elite_scheduled_rides', JSON.stringify(rides));
        renderScheduledRidesList();
      };

          if (r.notified15m) return;
          const rideDateTime = new Date(`${r.date}T${r.time}`).getTime();
          const diffMs = rideDateTime - now;
          if (diffMs > 0 && diffMs <= 900000) {
            if (Notification.permission === "granted") {
              new Notification("🚗 Elite Ride Scheduled Reminder", {
                body: `Your scheduled ride (${r.purpose}) departs in ~15 mins!\nRoute: ${r.pickup} ➔ ${r.dest}\nDriver Marcus Brody is en route.`,
                icon: "https://images.unsplash.com/photo-1549399542-7e3f8b79c341?w=120"

        stopLiveFaceCamera();

        try {
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            throw new Error("getUserMedia not supported in this browser context");
          }
          const stream = await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: faceCameraFacingMode,
              width: { ideal: 640 },
              height: { ideal: 640 }
            },
            audio: false
          });
          faceCameraStream = stream;
          video.srcObject = stream;
          video.style.transform = faceCameraFacingMode === "user" ? "scaleX(-1)" : "none";
          if (errorView) errorView.style.display = "none";
          if (guide) guide.style.display = "flex";
        } catch (err) {
          console.warn("Could not start face camera stream:", err);
          if (errorView) errorView.style.display = "flex";
          if (guide) guide.style.display = "none";
        }
      }

      function stopLiveFaceCamera() {
        if (faceCameraStream) {
          faceCameraStream.getTracks().forEach(track => track.stop());
          faceCameraStream = null;
        }
        const video = document.getElementById("face-cam-video");
        if (video) video.srcObject = null;
      }

      function flipFaceCamera() {
        faceCameraFacingMode = faceCameraFacingMode === "user" ? "environment" : "user";
        startLiveFaceCamera();
      }

      function captureLiveFacePhoto() {
        const video = document.getElementById("face-cam-video");
        if (!video || !video.videoWidth) {
          document.getElementById("face-cam-native-input")?.click();
          return;
        }

        // Shutter flash animation
        const flash = document.getElementById("face-cam-flash");
        if (flash) {
          flash.style.opacity = "1";
          setTimeout(() => { flash.style.opacity = "0"; }, 150);
        }

        // Capture square crop
        const canvas = document.createElement("canvas");
        const w = video.videoWidth;
        const h = video.videoHeight;
        const size = Math.min(w, h);
        const targetSize = Math.min(size, 512);

        canvas.width = targetSize;
        canvas.height = targetSize;
        const ctx = canvas.getContext("2d");

        // Handle front camera mirroring
        if (faceCameraFacingMode === "user") {
          ctx.translate(targetSize, 0);
          ctx.scale(-1, 1);
        }

        const sx = (w - size) / 2;
        const sy = (h - size) / 2;
        ctx.drawImage(video, sx, sy, size, size, 0, 0, targetSize, targetSize);

        const dataUrl = canvas.toDataURL("image/jpeg", 0.88);
        showFacePhotoPreview(dataUrl);
      }

      function handleFacePhotoFileInput(e) {
        const file = e.target.files && e.target.files[0];
        if (file) {
          processFacePhotoFile(file);
        }
        e.target.value = "";
      }

      function processFacePhotoFile(file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const size = Math.min(img.width, img.height);
            const targetSize = Math.min(size, 512);
            canvas.width = targetSize;
            canvas.height = targetSize;
            const ctx = canvas.getContext("2d");

            const sx = (img.width - size) / 2;
            const sy = (img.height - size) / 2;
            ctx.drawImage(img, sx, sy, size, size, 0, 0, targetSize, targetSize);

            const dataUrl = canvas.toDataURL("image/jpeg", 0.88);
            showFacePhotoPreview(dataUrl);
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      }

      function showFacePhotoPreview(dataUrl) {
        facePhotoPendingDataUrl = dataUrl;
        const previewView = document.getElementById("face-preview-container");
        const previewImg = document.getElementById("face-captured-preview-img");
        const liveView = document.getElementById("face-view-live");
        const uploadView = document.getElementById("face-view-upload");

        if (previewImg) previewImg.src = dataUrl;
        if (previewView) previewView.style.display = "flex";
        if (liveView) liveView.style.display = "none";
        if (uploadView) uploadView.style.display = "none";

        stopLiveFaceCamera();
      }

      function retakeFacePhoto() {
        facePhotoPendingDataUrl = null;
        const previewView = document.getElementById("face-preview-container");
        if (previewView) previewView.style.display = "none";
        switchFacePhotoTab("live");
      }

      function confirmSaveFacePhoto() {
        if (!facePhotoPendingDataUrl) return;

        const photo = facePhotoPendingDataUrl;
        try {
          localStorage.setItem("eliteride_rider_photo", photo);
          const u = JSON.parse(localStorage.getItem("eliteride_user_profile") || "{}");
          u.riderPhotoUrl = photo;
          localStorage.setItem("eliteride_user_profile", JSON.stringify(u));
        } catch (e) {
          console.warn("Storage write error:", e);
        }

        // Notify app
        window.dispatchEvent(new Event("eliteride_photo_updated"));
        ensureRiderPhotoInHeader();

        // Update active thumbnail in modal
        const thumb = document.getElementById("active-face-photo-thumb");
        if (thumb) thumb.src = photo;

        // Trigger callback if opened from component
        if (typeof onFacePhotoSavedCallback === "function") {
          onFacePhotoSavedCallback(photo);
        }

        // Show toast
        const toast = document.getElementById("face-success-toast");
        if (toast) {
          toast.style.display = "flex";
          setTimeout(() => {
            toast.style.display = "none";
            closeFacePhotoCaptureModal();
          }, 1200);
        } else {
          closeFacePhotoCaptureModal();
        }
      }

      function openFacePhotoCaptureModal(callback) {
        injectFaceProfilePhotoModal();
        onFacePhotoSavedCallback = callback || null;
        facePhotoPendingDataUrl = null;

        const modal = document.getElementById("elite-face-photo-modal");
        if (modal) {
          modal.style.display = "flex";

          // Update active thumb
          const thumb = document.getElementById("active-face-photo-thumb");
          if (thumb) {
            const current = localStorage.getItem("eliteride_rider_photo") || 
                            (JSON.parse(localStorage.getItem("eliteride_user_profile") || "{}").riderPhotoUrl) || 
                            "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=250";
            thumb.src = current;
          }

          const toast = document.getElementById("face-success-toast");
          if (toast) toast.style.display = "none";

          switchFacePhotoTab("live");
        }
      }

      function closeFacePhotoCaptureModal() {
        stopLiveFaceCamera();
        const modal = document.getElementById("elite-face-photo-modal");
        if (modal) modal.style.display = "none";
        facePhotoPendingDataUrl = null;
        onFacePhotoSavedCallback = null;
      }

      window.openFacePhotoCaptureModal = openFacePhotoCaptureModal;
      window.closeFacePhotoCaptureModal = closeFacePhotoCaptureModal;
